<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="description" content="A modern text-to-speech web application">

<title>Text to Speech</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<main class="container">
    <section class="card">

        <div class="header">
            <div class="icon">
                <img src="images/volume-up.png" alt="" class="icon-img">
            </div>

            <div>
                <h1>Text to Speech</h1>
                <p>Convert your text into natural-sounding speech.</p>
            </div>
        </div>

        <div class="textarea-wrapper">
            <textarea
                id="textArea"
                class="textArea"
                placeholder="Type or paste something here..."
                maxlength="1000"
                aria-label="Text to convert to speech"
            ></textarea>

            <span class="character-count">
                <span id="charCount">0</span>/1000
            </span>
        </div>

        <div class="controls">

            <div class="select-wrapper">
                <label for="voiceSelect">Voice</label>
                <select id="voiceSelect" class="select">
                    <option value="">Loading voices...</option>
                </select>
            </div>

            <button class="btn" id="speakBtn" type="button">
                <img
                    src="images/play.png"
                    class="image"
                    alt=""
                >
                <span class="btnText">Listen</span>
            </button>

        </div>

        <div class="status" id="status">
            Ready to speak
        </div>

    </section>
</main>

<script src="script.js"></script>

</body>
</html>
